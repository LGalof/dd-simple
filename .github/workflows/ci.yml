name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ddsimple
          POSTGRES_PASSWORD: ddsimple
          POSTGRES_DB: ddsimple_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddsimple -d ddsimple_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ddsimple:ddsimple@localhost:5432/ddsimple_ci
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @dd-simple/api

      - name: Verify database migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Build shared
        run: npm run build --workspace @dd-simple/shared

      - name: Build web
        run: npm run build --workspace @dd-simple/web

      - name: Test api with coverage
        run: npm --workspace @dd-simple/api run test:coverage

      - name: Test web with coverage
        run: npm --workspace @dd-simple/web run test:coverage

      - name: Build api
        run: npm run build --workspace @dd-simple/api

      - name: Analyze with SonarQube
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube configuration notice
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SonarQube analysis skipped because SONAR_TOKEN or SONAR_HOST_URL is not configured."
