name: dd-simple-sonarqube

services:
  sonarqube:
    image: sonarqube:community
    container_name: dd-simple-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube-local
    ports:
      - "9000:9000"
    stop_grace_period: 1h
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  sonarqube-db:
    image: postgres:16
    container_name: dd-simple-sonarqube-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
    name: infra_sonarqube_data
    external: true
  sonarqube_extensions:
    name: infra_sonarqube_extensions
    external: true
  sonarqube_logs:
    name: infra_sonarqube_logs
    external: true
  sonarqube_db_data:
    name: infra_sonarqube_db_data
    external: true
